<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Starry Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030108;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
        }

        /* Canvas làm nền bầu trời sao */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Khung nội dung chính đè lên nền sao */
        .content-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            pointer-events: none; /* Cho phép tương tác di chuột xuyên qua xuống canvas */
        }

        .card {
            background: rgba(20, 10, 30, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 182, 217, 0.2);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(230, 57, 149, 0.25),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            max-width: 550px;
            width: 90%;
            pointer-events: auto;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 154, 158, 0.5);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #f0e6ff;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .highlight {
            color: #ff80bf;
            font-weight: bold;
        }

        .heart-btn {
            margin-top: 15px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.6);
            transition: all 0.3s ease;
        }

        .heart-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 65, 108, 0.9);
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="content-container">
        <div class="card">
            <h1>✨ Happy 20/10 ✨</h1>
            <p>Chúc bạn nữ luôn lấp lánh và rạng rỡ như hàng ngàn ngôi sao trên bầu trời đêm!</p>
            <p>Mong rằng mỗi ngày trôi qua đều đong đầy hạnh phúc, ngập tràn niềm vui và gặt hái nhiều thành công rực rỡ. <span class="highlight">💖</span></p>
            <button class="heart-btn" onclick="burstStars()">Gửi Ngàn Thả Tim 💕</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 1800; // Số lượng ngôi sao dày đặc như hình

        // Lớp đối tượng Ngôi Sao
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Tọa độ ngẫu nhiên từ tâm hoặc khắp màn hình
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width; // Độ sâu 3D
                this.size = Math.random() * 1.8 + 0.2;
                
                // Bảng màu hồng, tím, trắng lấp lánh như bức ảnh
                const colors = [
                    '#ffffff', 
                    '#ffe6f2', 
                    '#ff99dd', 
                    '#ff66cc', 
                    '#cc99ff', 
                    '#ff3399'
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
            }

            update() {
                // Tốc độ di chuyển tiến về phía màn hình (tạo hiệu ứng dải ngân hà 3D)
                this.z -= 0.6;
                if (this.z <= 0) {
                    this.reset();
                    this.z = width;
                }

                // Hiệu ứng nhấp nháy
                this.opacity += this.twinkleSpeed;
                if (this.opacity > 1 || this.opacity < 0.2) {
                    this.twinkleSpeed = -this.twinkleSpeed;
                }
            }

            draw() {
                // Chuyển đổi tọa độ 3D sang 2D
                const k = 256 / this.z;
                const px = this.x * k + width / 2;
                const py = this.y * k + height / 2;

                if (px < 0 || px >= width || py < 0 || py >= height) {
                    return;
                }

                const r = Math.max(0.1, this.size * (1 - this.z / width) * 2.5);

                ctx.save();
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.min(1, Math.max(0, this.opacity));
                
                // Tạo quầng sáng lấp lánh xung quanh hạt
                if (r > 1.2) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                }

                ctx.fill();
                ctx.restore();
            }
        }

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            // Tạo nền tối với vệt mờ nhẹ cho cảm giác mượt mà
            ctx.fillStyle = 'rgba(3, 1, 8, 0.3)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        // Tạo hiệu ứng bùng nổ sao khi bấm nút
        function burstStars() {
            stars.forEach(star => {
                star.z -= 150;
            });
        }

        window.addEventListener('resize', initCanvas);

        // Khởi chạy
        initCanvas();
        animate();
    </script>
</body>
</html>
